# docker-compose for deploying souply-api to OMV.
#
# Setup assumptions:
#   - MariaDB (souply-mariadb) and Redis (souply-redis) run in sibling
#     containers brought up by /opt/souply/docker-compose.infra.yml.
#     They join `mysql_net` + `souply_redis_default` respectively.
#   - MinIO is shared with basket-api on `minio_2_default`. Same bucket
#     (MINIO_PRODUCT_IMAGES_BUCKET) so existing product photography
#     stays visible across both stacks during cutover.
#   - basket-api is still running on host port 3000 → souply-api
#     binds to 3001 so the two coexist while we cut traffic over.
#   - Traefik runs on the Raspberry Pi (separate host); reach this
#     service via LAN IP + port 3001 once api.souply.lt DNS lands.
#
# TWO environments off ONE image (staging runs the exact artifact prod
# runs — the point of staging):
#
#   souply-api          PROD     → :3001 → souply_production  (api.souply.lt)        env: .env.production
#   souply-api-staging  STAGING  → :3002 → souply_test        (api.souply.manofoto)  env: .env.staging
#
# Only the PROD service has a `build:`; staging reuses the same
# `souply-api:latest` image. So:
#   cd /opt/souply
#   docker compose -f souply-api/docker-compose.yml build           # builds souply-api:latest
#   docker compose -f souply-api/docker-compose.yml up -d           # starts BOTH (prod + staging)
#   docker compose -f souply-api/docker-compose.yml logs -f
#
# Build context is /opt/souply (NOT souply-api/) so the shared/ sibling
# folder is in the build context.

services:
  # ── PRODUCTION ─────────────────────────────────────────────────
  souply-api:
    build:
      context: ..
      dockerfile: souply-api/Dockerfile
    image: souply-api:latest
    container_name: souply-api
    restart: unless-stopped
    env_file:
      - .env.production         # DB_NAME=souply_production, CORS_ORIGINS=https://souply.lt
    ports:
      - "3001:3000"
    networks:
      - mysql_net              # souply-mariadb reachable as souply-mariadb:3306
      - minio_2_default        # shared MinIO
      - souply_redis_default   # souply-redis reachable as souply-redis:6379
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/docs/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── STAGING ────────────────────────────────────────────────────
  # Same image as prod (no build:) so we promote a verified artifact.
  souply-api-staging:
    image: souply-api:latest
    container_name: souply-api-staging
    restart: unless-stopped
    env_file:
      - .env.staging            # DB_NAME=souply_test, CORS_ORIGINS=https://souply.manofoto.dpdns.org
    ports:
      - "3002:3000"
    networks:
      - mysql_net
      - minio_2_default
      - souply_redis_default
    depends_on:
      - souply-api              # ensures the image is built before staging starts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/docs/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # All three networks pre-exist on OMV; `external: true` tells
  # docker-compose not to try to create them. The `name:` must match
  # `docker network ls` exactly. souply_redis_default was created by
  # docker-compose.infra.yml the first time you brought it up.
  mysql_net:
    external: true
    name: mysql_net
  minio_2_default:
    external: true
    name: minio_2_default
  souply_redis_default:
    external: true
    name: souply_redis_default
