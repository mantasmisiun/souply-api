# docker-compose for deploying basket-api to OMV.
#
# Setup assumptions:
#   - MySQL + MinIO run in containers on OMV, connected to a shared
#     docker network (see `backend` below).
#   - Traefik runs on the Raspberry Pi (separate host). Traefik
#     reaches this service via LAN IP + port 3000 — NOT via docker
#     labels (labels only work when Traefik and the service share
#     a docker host). The pi's Traefik gets a file-provider route
#     pointing at http://192.168.1.212:3000.
#
# Build + run from /Project/ (NOT basket-api/) so the shared/
# sibling folder ends up in the build context:
#
#   cd /opt/Project         (or wherever you put the code on OMV)
#   docker compose -f basket-api/docker-compose.yml build
#   docker compose -f basket-api/docker-compose.yml up -d
#   docker compose -f basket-api/docker-compose.yml logs -f

services:
  basket-api:
    build:
      context: ..
      dockerfile: basket-api/Dockerfile
    container_name: basket-api
    restart: unless-stopped

    env_file:
      - .env.production

    # Bind OMV host port so the Pi's Traefik can reach us at
    # http://192.168.1.212:3000. Keep the bind on 0.0.0.0 (default);
    # your home LAN firewall controls who else can hit it.
    ports:
      - "3000:3000"

    networks:
      # Shared network with MySQL + MinIO. Edit the name below to
      # match your existing network (find it with `docker network ls`
      # on OMV — common names: `backend`, `omv_default`, whatever
      # your MySQL compose named it).
      - backend

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api-docs/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  backend:
    external: true
    # ── EDIT THIS ─────────────────────────────────────────────
    # Name of the docker network MySQL + MinIO share on OMV.
    # On OMV: `docker network ls` → pick the network your MySQL
    # container belongs to. Replace below.
    name: backend
