                "recipeInstructions": "Karką gerai nuskusti ir išmirkyti šaltame vandenyje.Į aliejų įspausti citrinos sultis, suberti druskos šaukštelį, rudąjį cukrų, sudėti smulkintą česnaką, kmynus, kitus prieskonius, išmaišyti ir mišiniu ištrinti karką.
Į kepimo maišelį sudėti karką ir supilti ir susidariusį skystį. Įdėti į dubenį, kepimo maišelio neužrišti. Vis pavartant ir pamaigant, marinuoti karką apie parą.Dėti karką į kepimo skardą, kepimo maišelį užrišti. Kepti karką, kol kas be daržovių, 190 C laipsnių įkaitintoje orkaitėje apie 90 min.Bulves, moliūgus, papriką supjaustyti kubeliais, morką ir svogūną griežinėliais, pomidorus skiltelėmis. Daržovės sudėti į dubenį, suberti likusią druską, prieskonines žoleles, supilti grietinėlę ir permaišyti.Jau gerokai pakepusią karką išimti greitai iš kepimo skardos. Į tą pačią skardą berti daržoves. Karką išimti iš maišelio, riebų skystį išpilti, nenaudoti. Supjaustyti karką ant kaulo kvadratėliais. Dėti ant daržovių. Dar viską kepti apie 40 min."
