<title>Fantastiškas varškės apkepas - Beatos virtuvė</title>
<meta property="og:image" content="https://beatosvirtuve.lt/wp-content/uploads/2026/05/varskes-apkepas.jpg">
<script type="application/ld+json">{"@context":"http:\/\/schema.org","@type":"Recipe","name":"Fantasti\u0161kas var\u0161k\u0117s apkepas","author":{"@type":"Person","name":"Beata Nicholson"},"datePublished":"2026-06-21","description":"Daug kas moka pagaminti klasikin\u012f var\u0161k\u0117s apkep\u0105 su man\u0173 kruopomis. Pasirodo, kad mano svetain\u0117je tai yra pats ie\u0161komiausias receptas. Mes j\u012f dar kiek patobulinome, kad apkepas b\u016bt\u0173 nuostabiai aromatingas, mink\u0161tas ir fantasti\u0161kas. Mano manymu, var\u0161k\u0117s apkepui geriausiai tinka dr\u0117gnesn\u0117 var\u0161k\u0117. Ji yra mink\u0161ta, jos nereikia papildomai malti ar trinti per sietel\u012f.","image":"https:\/\/beatosvirtuve.lt\/wp-content\/uploads\/2026\/05\/varskes-apkepas.jpg","recipeYield":6,"keywords":"Apkepas, Su var\u0161ke, Var\u0161k\u0117s apkepas","recipeIngredient":["1 kg var\u0161k\u0117s","6 kiau\u0161ini\u0173 ","70 g cukraus","Druskos","100 g man\u0173 kruop\u0173","150 ml pieno ","\u0160auk\u0161telio vanil\u0117s esencijos ar ekstrakto (tinka ir vanilinis cukrus)  ","Apelsino","Citrinos","2 \u0161auk\u0161t\u0173 razin\u0173 ","Pus\u0117s \u0161auk\u0161telio malto cinamono ","Sviesto kepimo formai i\u0161tepti "],"recipeInstructions":[{"@type":"HowToStep","text":"Atskiriame kiau\u0161ini\u0173 baltymus nuo tryni\u0173. \n"},{"@type":"HowToStep","text":"Var\u0161k\u0119 i\u0161triname su kiau\u0161ini\u0173 tryniais ir \u017eiupsneliu druskos. \n"},{"@type":"HowToStep","text":"Man\u0173 kruopas u\u017epilame pienu, kad truput\u0117l\u012f pabrinkt\u0173. \n"},{"@type":"HowToStep","text":"\u012e sutrint\u0105 var\u0161k\u0119 d\u0117l skonio \u012fpilame vanil\u0117s esencijos ar ekstrakto. Tinka ir vanilinis cukrus.  \u012etarkuojame gerai nuplaut\u0173 apelsino ir citrinos \u017eievel\u0119. \n"},{"@type":"HowToStep","text":"Ant razin\u0173 i\u0161spaud\u017eiame apelsino ir pus\u0117s citrinos sultis. Jas truput\u012f pakaitiname ir paliekame brinkti, kad b\u016bt\u0173 mink\u0161tesn\u0117s. Galite razin\u0173 ir ned\u0117ti, bet man jos apkepui labai tinka. Gera alternatyva cukrui. \n"},{"@type":"HowToStep","text":"Dabar i\u0161plakime kiau\u0161inio baltymus. Pirmiausia pradedame plakti be nieko. Kai jie prad\u0117s  putoti, \u012fd\u0117kime 2 \u0161auk\u0161tus cukraus ir plakime toliau. D\u0117kime dar \u0161auk\u0161t\u0105 cukraus ir plakime.  Putos neturi tapti tokios stand\u017eios, kaip gaminant moreng\u0105. \n"},{"@type":"HowToStep","text":"Kai razinos i\u0161brinks, jas i\u0161imkime i\u0161 sul\u010di\u0173. \n"},{"@type":"HowToStep","text":"I\u0161brinkusias man\u0173 kruopas i\u0161mai\u0161ome su var\u0161k\u0117s ir tryni\u0173 mase, razinomis. Galima \u012fpilti \u0161iek tiek sul\u010di\u0173, kuriame vir\u0117 razinos. \u012eberkime vos vos malto cinamono. Bet nepadauginkime, kad apkepas b\u016bt\u0173 baltos spalvos. \n"},{"@type":"HowToStep","text":"Paskutinis etapas \u2013 \u012f \u0161i\u0105 mas\u0119 atsargiai ir l\u0117tai \u012fmai\u0161yti i\u0161plaktus baltymus.  \n"},{"@type":"HowToStep","text":"Kepimo skard\u0105 i\u0161tepame su sviestu. Supilame var\u0161k\u0117s apkepo mas\u0119 ir kepame 180 laipsni\u0173 orkait\u0117je apie 40 minu\u010di\u0173. \n"}]}</script>
