<meta property="og:image" content="">
<script type="application/ld+json">{"@context":"http://schema.org","@type":"Recipe","mainEntityOfPage":"true","name":"Best Banana Bread","author":"lkadlec","cookTime":"PT1H","prepTime":"PT10M","totalTime":"PT1H10M","datePublished":"1999-09-26T20:49Z","description":"Make and share this Best Banana Bread recipe from Food.com.","image":"https://img.sndimg.com/food/image/upload/q_92,fl_progressive,w_1200,c_scale/v1/img/recipes/28/86/wBZxNua1T8yfDwbfo9Fz_0S9A9315.jpg","recipeCategory":"Quick Breads","keywords":"Breads,Fruit,Oven,\u003c 4 Hours","recipeIngredient":["1/2  cup    butter, softened ","1   cup    granulated sugar","2       eggs, beaten ","3       bananas, finely crushed  (for serious and extreme moist and delicious, try 4 bananas)","1 1/2  cups    all-purpose flour","1   teaspoon    baking soda","1/2  teaspoon    salt","1/2  teaspoon    vanilla (optional)"],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5.0","reviewCount":"2351"},"nutrition":{"@type":"NutritionInformation","calories":"272.8","fatContent":"10.5","saturatedFatContent":"6.2","cholesterolContent":"61.6","sodiumContent":"338.3","carbohydrateContent":"42.5","fiberContent":"1.4","sugarContent":"24.4","proteinContent":"3.7"},"recipeInstructions":[{"@type":"HowToStep","text":"Remove odd pots and pans from oven."},{"@type":"HowToStep","text":"Preheat oven to 350\u0026ordm; / 180\u0026ordm;."},{"@type":"HowToStep","text":"Cream together butter and sugar."},{"@type":"HowToStep","text":"Add eggs and crushed bananas."},{"@type":"HowToStep","text":"Combine well."},{"@type":"HowToStep","text":"Sift together flour, soda and salt. Add to creamed mixture. Add vanilla."},{"@type":"HowToStep","text":"Mix just until combined. Do not overmix."},{"@type":"HowToStep","text":"Pour into greased and floured loaf pan."},{"@type":"HowToStep","text":"Bake at 350\u0026ordm; / 180\u0026ordm; for 55 minutes."},{"@type":"HowToStep","text":"Keeps well, refrigerated."}],"recipeYield":"1 loaf, 10 serving(s)","review":[{"@type":"Review","description":"Have tried many banana breads but this is one of the best.  I added walnuts to mine.  Would recommend this to anyone.  A winner for sure!","datePublished":"October 22, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Rita Freesemann"}},{"@type":"Review","description":"I have been searching for a good banana bread recipe for over a year and I finally found it!  What a super simple recipe with excellent results!!!  Try it - You'll LOVE it!!","datePublished":"April 24, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Nicole Schmitt"}},{"@type":"Review","description":"Nice moist banana bread.  My husband was especially impressed with the nice way the banana flavor comes through.  I think I will add chopped walnuts next time.","datePublished":"January 09, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Sharlene~W"}},{"@type":"Review","description":"5 stars baby!!! Bam!!! This is the bomb banana bread!!\r\nthe term bomb is a good thing :) Kids like it. Neighbor\r\nlikes it. Husband likes it. I like it. Thank you for sharing \r\nit!! :)","datePublished":"September 10, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Christina M"}},{"@type":"Review","description":"I have made numerous versions of banana bread and I really like this one! I like to add a sprinkle of brown sugar on the top before baking...really adds a little extra without being too sweet...thanks so much for the recipe. I actually make these as muffins.","datePublished":"June 27, 2011","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"professorcate"}},{"@type":"Review","description":"I always laugh when I see a review for a recipe that says something to the effect of \u0026quot;Best recipe ever!  I replaced this with that, and that with this, and added that and reduced this, and it was the best banana bread I ever made!  Thanks for such a wonderful recipe!\u0026quot;  I changed nothing, and it truly was the best banana bread I\u0026#039;ve ever made :-).  Not sure if my altitude caused it to rise a ton, but it almost overflowed so I scooped some out and put it in muffin tins, and both the loaf and muffins were perfect.  To be safe, next time I divided the batter into 2 loaf pans and made slightly smaller loaves than I normally would, but that\u0026#039;s certainly no problem.  I highly recommend this recipe (as is, or do what you want with it because you can\u0026#039;t go wrong!).","datePublished":"March 26, 2014","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"judes966"}},{"@type":"Review","description":"Quick and easy recipe turned out great! Baking fun with my 3 year old. We used 3 bananas, a little applesauce, and a dash of cinnamon. We used a bundt pan instead of a loaf pan, it was done in 39 minutes.","datePublished":"September 25, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"shyaries11"}},{"@type":"Review","description":"I didn't follow the recipe at all and added a bunch of superfluous ingredients. Thus I'm reviewing a recipe completely different from what is posted. Stop the madness! Reviews are meant to review the actual recipe not something lil Miss Betty crocker decides to makeup","datePublished":"May 03, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Kevin M."}},{"@type":"Review","description":"I laughed out loud when I read the first line of the recipe: “Remove odd pots and pans from oven.” Anyone who has ever had a kitchen that requires using the oven as storage will recognize the wisdom of starting a recipe this way. ?? (Great recipe btw)","datePublished":"July 11, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"smp2754"}},{"@type":"Review","description":"I have tried many many banana bread recipes over the years - and this is the absolute best.","datePublished":"June 04, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Deb Evert"}},{"@type":"Review","description":"I used one more banana than called for because I had it to use.  The result was a bread that was yummy, though a bit mushy.  We don't mind, but for guests I would have adherred more closely to the recipe, which is fantastically simple and delicious.","datePublished":"April 18, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Gay Gilmore"}},{"@type":"Review","description":"My 10-year old daughter was looking for something to make and found this recipe.  She made it all by herself and it was wonderful!","datePublished":"January 17, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Andrea"}},{"@type":"Review","description":"Just made it and it was a success! My family doesn't like bananas but they loved the banana bread!","datePublished":"February 04, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"angelad1006"}},{"@type":"Review","description":"excellent.  be sure not to keep it in more than an hour, its perfect at that time.","datePublished":"October 16, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Sol5560"}},{"@type":"Review","description":"LIVES UP TO THE HYPE!  I only used 3 med. to large bananas and used 1/2 c. turbinado sugar and 1/2 c. white sugar, still turned out great.  Of course, flavor is even richer after a day or so.","datePublished":"November 06, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"jessi-ryan"}},{"@type":"Review","description":"Tried this recipe and the Grandchildren love it.Now I'm asked all the time to make this bread for them. I love it too.","datePublished":"September 04, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Tom232"}},{"@type":"Review","description":"This is very tasty and moist. The only thing I would be able to tell anyone is that if you use a non stick pan.....I would decrease the cooking time by at least 5 minutes. It was still VERY good but the bottom crust was a little too done for my taste. This recipe is a keeper!","datePublished":"April 10, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Alexi's Mom"}},{"@type":"Review","description":"I made this recipe twice, both times it was delicious! the first time following the recipe exactly with choc. chips. the second, i substituted whole-wheat flour and applesauce, due to lack of ingreidents and added walnuts and cranberries.  the result was a very moist tasty bread.  this one's a keeper!","datePublished":"February 02, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"arianne"}},{"@type":"Review","description":"Best Banana Bread! COVID-19 will make bakers out of all of us. I used 3/4 cup of sugar instead, covered the top in alfoil for the last 15mins and baked for 1hour. Used rectangle stoneware tray from Kmart: 5.5cm (H) x 23.5cm (W) x 5.2cm (D) I also stirred walnuts through and placed whole ones on top! Unreal!","datePublished":"April 01, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Gina P."}},{"@type":"Review","description":"Oh my goodness, this may be the best banana bread I've ever made or eaten!  I did use 1/4 cup applesauce in place of half the butter and I used half white and half brown sugar and added 1/2 tsp cinnamon.  I baked it in two aluminum bread pans for 50 min.  I let them rest for 10 min. after removing them from the oven, then got them out of the pans and cooled on a rack.  I then ate half a loaf and am thinking about going back for more.  It is SO Good!!!!","datePublished":"May 14, 2011","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Okra4540"}},{"@type":"Review","description":"I am a rookie baker, and this is the first time trying this recipe. I cut the recipe in half since it's just my wife and I holed up for the C-19 pandemic. I used a muffin tin instead of a bread pan and I added 1/2 cup chopped walnuts. The 55 minutes seemed like a really long time to me, and because they are muffins and not a loaf, I monitored it closely - - took them out at 22 minutes, and they are perfect. My wife will be impressed when she wakes up this morning to coffee and fresh baked banana bread muffins! Happy wife, happy life...","datePublished":"April 11, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Jack S."}},{"@type":"Review","description":"This is a wonderful recipe. I swapped out the butter for coconut oil. No, you cannot taste the coconut oil. I prefer using 4 bananas. Organic bananas have more flavor in my opinion, so I like to use those. After I pour into my bread pan, that I coat with coconut oil, I top the batter with diced pecans. This is a HUGE hit in my house.","datePublished":"August 20, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Kelly K."}},{"@type":"Review","description":"Luscious recipe (I add the extra banana), but my favorite part is \u0026quot;remove odd pots and pans from oven\u0026quot;. If only every recipe I've used had started this way.......Thank you lkadlec!","datePublished":"September 08, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"D P.5591"}},{"@type":"Review","description":"Delicious banana bread! I added chocolate chips and pecans. Yom!","datePublished":"October 11, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Andrea S."}},{"@type":"Review","description":"This bread is great!!!  Added pecans and could have eaten the whole loaf myself. Quick to mix and taste is supreme!!!","datePublished":"January 31, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"LAURIE"}},{"@type":"Review","description":"The smell of this when its in the oven!....wow....this is delish!!  =)","datePublished":"September 17, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"ltdsaloon16r"}},{"@type":"Review","description":"Loved it! I added 4 super ripe small bananas instead of 3. It's nice and moist and very simple.","datePublished":"May 21, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"tyshastx"}},{"@type":"Review","description":"love it....\r\ni put chocolate frosting with\r\nalmond bits and spred some \r\ncinnamon powder...yummy!","datePublished":"September 23, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"yihua.ms89"}},{"@type":"Review","description":"I'm going to make this later, but I absolutely love we have be told to remove the crap in the oven 1st.","datePublished":"December 08, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"E S.7415"}},{"@type":"Review","description":"going to make this just because the recipe starts with \u0026quot;remove odd pots and pans from oven\u0026quot;!","datePublished":"January 22, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"ogre66"}},{"@type":"Review","description":"Made this recipe last night and used mini bread loaf pans to send to the ER where my daughter is a Doc. Scrumptious and so appreciated at this time. I make the next batch in muffins and wrap each one to avoid any worry with spread of germs!","datePublished":"March 27, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Leslie P."}},{"@type":"Review","description":"Hands down the best Banana bread ever! . My advice is to NOT change a thing in this recipe, it is perfectly delicious as is! I will be making a few loafs for the upcoming holidays. Also Don’t forget.... after the loaf of bread is room temperature, wrap It in foil and plastic wrap and freeze it. When ready to use, remove the foil and plastic wrap and cut the bread in slices (while still frozen) This keeps the bread from crumbling!","datePublished":"October 23, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"8maxwells"}},{"@type":"Review","description":"This is fantastic!  I used applesauce instead of butter, whole wheat flour instead of white, cut the sugar in half, and doubled the recipe.  I made muffins instead of a loaf (couldn't find my loaf pan!) and they still turned out great.  I cooked the muffins for about 25 minutes, and sprayed the papers with Pam (otherwise, the crust sticks to the paper).  Even with all those changes, they came out dense but moist, with a wonderful not-too-sweet banana flavor.  Great recipe!","datePublished":"May 10, 2011","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Jaudon"}},{"@type":"Review","description":"I’ve made this with both 1 c of white sugar and with 1/2 white and 1/2 brown. Both turned out beautifully, but I preferred the half white sugar and half brown. I prefer a more moist banana bread, so I also use 4 medium bananas. My “go to” recipe!","datePublished":"November 09, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Janet P."}},{"@type":"Review","description":"This was extremely delicious!! My go-to recipe!!! Smells and tastes delicious!! I added walnuts for an extra crunch and flavor, that made it even yummier!! The holes on the top are because e checked if it was cooked with a fork. A LOT!","datePublished":"April 19, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"disshukla"}},{"@type":"Review","description":"This literally IS the BEST Banana Bread ever! First time making it ever \u0026amp; it's perfect! So easy to make \u0026amp; it's insanely moist. I used 3 large bananas. It was so moist I actually cooked an extra 6 minutes or so. Popped out of the pan with no problem. This has been the highlight of my quarantine!","datePublished":"March 22, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Shana H."}},{"@type":"Review","description":"Excellent! Made muffins. Added 1 cup of walnuts. Baked for 25 minutes.","datePublished":"February 23, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"jbandrr"}},{"@type":"Review","description":"I had the blackened bananas, but what recipe to use? I found this recipe when searching for BEST banana bread and I'm very glad I did. To be honest, I'm not a huge banana bread fan. But with the tweaks suggested and one or two of my own, I know this will be a keeper! My changes: I used 2 cups flour and added 1/2 cup cacao powder I added 1 t cinnamon and 1 t vanilla I stirred in 1/2 c yogurt (was looking to use sour cream but didn't have any). I subbed coconut sugar for the white sugar. I made a glaze as was suggested by melting 2 T butter with 1 T honey, then stirring in 2 T cream and nearly 1/2 cup coconut sugar and pouring it over the hot bread. It gave it lovely burnt notes!You'll note I used an oval baking dish as I the batter seemed too much for my small loaf pan, so my baking time wasn't as long as some have required. It is more cake than bread, but the basics are there!","datePublished":"February 12, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Patty D."}},{"@type":"Review","description":"Great recipe as is however i add 4 bananas, cinnamon, extra vanilla, approx 1 tsp and 1/2 cup of sour cream which makes the bread very moist. Instead of 1 cup of sugar, i use half cup of granulated sugar and half cup of brown sugar. Very versatile recipe.","datePublished":"October 20, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Belinda D."}},{"@type":"Review","description":"Funny, \u0026quot;Remove odd pots and pans from oven.\u0026quot;","datePublished":"December 14, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"marionscottsmith.biz"}},{"@type":"Review","description":"This recipe is delicious and was a big hit with my family. I used 4 bananas to ensure a moist and very \u0026quot;banana-ee\u0026quot; bread. The tweaks I made to this yummy recipe were using 1/2 brown sugar and 1/2 white sugar and adding about 1/2 a cup of walnuts. I love when the outside crust of the bread is slightly crunchy and caramelized and the brown sugar helps make that happen. Next time I plan on making the bread without changing anything just for fun. Can't wait to try it out.","datePublished":"March 19, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"JoJoRio"}},{"@type":"Review","description":"This turned out really well.\r\nI used 3/4 cup sugar and 1 1/4 cup flour.\r\nThe bread was dense, but had a wonderful flavor.\r\nI sprayed the pan with cooking spray just to be sure it came out in one piece.","datePublished":"July 25, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"jean"}},{"@type":"Review","description":"I love that the first instruction was to remove odd pots and pans from the oven. Great and delicious recipe","datePublished":"April 12, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Laura R."}},{"@type":"Review","description":"I love how it starts off with \u0026quot;remove odd pots and pans from the oven to preheat\u0026quot;... Now you know its gonna be good! Seriously, good bakers have so many pots and pans that storage becomes an issue! I love my banana bread with walnuts and craisins !","datePublished":"April 07, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Anonymous"}},{"@type":"Review","description":"My son and I have a process: I buy the bananas, he forgets to eat the bananas, I bake two loaves of this marvelous bread, he takes them to work, shares with his fellow LEOs, everyone is happy. Seriously, this is a fantastic recipe: quick, easy, delicious.","datePublished":"September 12, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Susan W."}},{"@type":"Review","description":"Best recipe ever! So easy to make...I only had two overripe bananas but followed the recipe to the letter (no tweaks) and it turned out perfectly...plenty of banana flavor and beautifully moist.","datePublished":"May 11, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"London P."}},{"@type":"Review","description":"Man, my hUsBaNd just gobbled this up and said YUM YUM!!!! Instead of bananas I used watermelon, and I traded the sugar for salt. I also put some Skittles in there, and some cayenne pepper. I did adjust the cooking time to 3 hours, cuz we were sleeping. Then I put a dallop of sour cream and a giant piece of parsley on top....so fancy! Will def make this for my hUsBand again!!!!","datePublished":"August 11, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"notreallyaplanet"}},{"@type":"Review","description":"Liked this banana bread! Liked the amount of bananas used in this recipe. The best part about this recipe is the amount of time it took to make and have in the oven! I think it took about 8 or 10 minutes and it was baking. I have a good banana recipe that I like, but the prep seems to take much longer. Will make again for sure! ( a tip about mashing bananas--I like to use a potato masher in a glass pie pan--it really speeds things up, and is easy to clean up!)","datePublished":"September 02, 2012","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"juliebugg"}},{"@type":"Review","description":"I will never try another banana bread recipe because this one is the BEST!  I used four very ripe bananas (many freckles) and added a 1/2 tsp. of cinnamon to the dry ingredients.  I divided the batter into two smaller foil pans and baked for about 35-40 minutes.  It is very moist and cake like with great banana flavor.  Thanks!","datePublished":"June 22, 2011","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Mary_K"}},{"@type":"Review","description":"Very ncie recipe","datePublished":"April 07, 2002","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Kim Boyle"}},{"@type":"Review","description":"My favorite banana bread recipe! I once forgot to bookmark it and searched forever for \u0026quot;the one with the funny line about the pans.) :) This recipe ever fails. I usually add walnuts.","datePublished":"December 28, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Foxy C."}},{"@type":"Review","description":"I never review recipes but I had to with this one. It is hands down and by far the best I have ever tried and believe me, I have tried a lot. Super easy and absolutely delicious!","datePublished":"May 11, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Meredith C."}},{"@type":"Review","description":"This has got to be the quickest and easiest banana bread recipe! I've tried this recipe 4 times within this past month (I wonder why there are so many browning bananas....) and I haven't failed yet! I use 4 bananas instead of 3, which results in a super super soft texture. I also saw a previous comment (thanks Sandra!) mentioning sprinkling sugar on the loaf, so I've been doing that a little less than halfway through the baking time. UPDATE: I forgot to mention that I've tried adding chocolate chips, walnuts, etc. but I prefer it without the extravagant additions.","datePublished":"July 01, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"studyingandjcw"}},{"@type":"Review","description":"I have used this recipe for years and love it!! I add mini semisweet morsels to the batter at the end, and once in the bread pan, I sprinkle on top a mixture of cinnamon/sugar. It gives it a nice crispy top. My family and husband's co-workers gobble it up every time with no crumb to spare!!","datePublished":"March 22, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Kristin V."}},{"@type":"Review","description":"Good stuff. Baked this for 25 minutes in an 8 mini loaf pan. Everyone loves their personal loaves.","datePublished":"December 31, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"mickeygonzalez"}},{"@type":"Review","description":"Bananas come in all shapes and sizes.  How many cups of bananas should I use?  I made this using the same amount of bananas (1 1/3 cups) as other breads that call for 1.5 cups flour.  It came out fine but I wish I knew what the contributor\u0026#039;s 4 bananas yielded then I\u0026#039;d feel more confident in rating it.","datePublished":"November 01, 2014","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":3,"bestRating":"5"},"author":{"@type":"Person","name":"sheenapd"}},{"@type":"Review","description":"Very good bread. It was much better than my wife's recipe. Of course she wouldn't admit it. The kids and I ate it all in one sitting. Will definetly make it again!!","datePublished":"September 27, 2010","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"nolan6692_12609133"}},{"@type":"Review","description":"EXCELLENT--truly the \"BEST\".  30 years of searching for the best taste, moistness, and easy recipe is finally over.  This is in my personal cook book for ever.  I did add some coconut, fresh grated nutmeg and some cinnamon for an added kick that pleased by personal food critic, hubby.  Thanks so much for sharing.","datePublished":"September 10, 2010","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Wannabe Gourmet"}},{"@type":"Review","description":"Awesome recipe! Thanks. My family loved it.","datePublished":"July 19, 2003","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Ricachica24"}},{"@type":"Review","description":"Yes, this really is the BEST BANANA BREAD!","datePublished":"June 18, 2001","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"jabeesgirl"}},{"@type":"Review","description":"I love this recipe, it is the best, it's not dry and is full of banana flavor and that is the point of banana bread after all. I bake the loaf in a pan lined with wax paper (as my grandmother did) and I found it needs more like 60 minutes in the oven at 350.","datePublished":"June 20, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Patrick A."}},{"@type":"Review","description":"I used 1/2 brown and 1/2 white sugar and 4 bananas. I also lowered the temperature to 325 degrees because I used a dark nonstick pan. I added a 1/2 cup chopped walnuts, and had to stop myself before we had eaten half of it!!","datePublished":"March 20, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"darrell71161"}},{"@type":"Review","description":"I've been making this banana bread for a couple years now, \u0026amp; it has never failed me! It's super moist, everyone loves it, there's never any left.. are you convinced yet? Really the only thing I add are milk chocolate chips, because why not? Thank you so much for this easy \u0026amp; delicious recipe!","datePublished":"December 04, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Melissa G."}},{"@type":"Review","description":"I made this last night and it's so easy! The result is a moist banana bread comparable to one that uses sour cream or yogurt) that's perfect for adding butter and jam to. Just a side note: I knew I was gonna like this recipe when the instructions started with \u0026quot;Remove odd pots and pans from oven.\u0026quot;","datePublished":"June 29, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"thbrownev3"}},{"@type":"Review","description":"Did come out a little raw in the middle so cooked it longer and that seemed to work:)","datePublished":"May 15, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Alondra M."}},{"@type":"Review","description":"Used 4 bananas. The best banana bread recipe by far. It came out PERFECT.","datePublished":"May 14, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Chrissy M."}},{"@type":"Review","description":"Easy and GOOD! I made strawberry glaze as a topping.","datePublished":"May 01, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"yepidoo"}},{"@type":"Review","description":"I’ve been a baking machine while in quarantine. This banana bread is the absolute best thing I have made, perfectly moist and flavorful. I’ve made it twice, second time I sprinkled brown sugar on top to give it a crunchy chew crust. I had to bake for an extra 10 minutes both times.","datePublished":"April 19, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Zachtina1983"}},{"@type":"Review","description":"Sheltering in with your quarantine bananas deeply browning was the perfect time for a first try at making banana bread. First, this recipe got my attention because of the first line in the directions. The author must know me personally. Had to make some adjustments due to access of materials in the market these days, Liquid eggs (1/3c), organic granulated sugar with a little top off of regular granulated, 1 1/2tsp baking powder and 4 bananas. D-E-L-I-C-I-O-U-S and completely aromatic. I am sheltering in solo, but I cut a quarter for me and dropped the rest to my sister and her family's doorstep. Definitely save this recipe!!!","datePublished":"April 05, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Jacquelle S."}},{"@type":"Review","description":"So I've never made banana bread before and am admittedly a terrible baker... that being said the quarantine blues have got me baking. This bread was perfect! I used 3 bananas and threw in some blueberries that werent getting eaten. It was so amazingly moist. Will def make again","datePublished":"March 23, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"ldarrow2914"}},{"@type":"Review","description":"Really yummy! I made 2 loaves, added cinnamon and chocolate chips to both (make sure you coat the chocolate chips in flour before adding so they don’t sink to the bottom). However, with the 2nd loaf I turned the heat down to 325 and cooked a little longer, about 70 minutes and it came out golden instead of a darker brown. I also covered the bread the last 10 minutes on both and that helped.","datePublished":"December 28, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Erin P."}},{"@type":"Review","description":"Great recipe! I did add cinnamon, ginger, pecans and walnuts.","datePublished":"December 27, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"saraj9614"}},{"@type":"Review","description":"It’s been awhile since I’ve made Banana Bread for my family. This is a great recipe and easy to follow I’m brewing the coffee now!","datePublished":"November 25, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Michael M."}},{"@type":"Review","description":"WOW. THIS is the recipe I had been looking for. I have been making banana bread for a long time and this recipe turned out perfect and best tasting of all my banana bread batch ever. Made it last night triple the recipe and wow.","datePublished":"October 19, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Roxanne A."}},{"@type":"Review","description":"I’ve made this recipe numerous times over the years, it is my go-to success story. I make it with either 3 or 4 bananas, both are great. Thank you for sharing...it’s always a hit with family and friends.","datePublished":"September 19, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"shawn33mari3"}},{"@type":"Review","description":"Im only 15 and this is my second time making banana bread. The first time i used a different recipe and it came out so bad, but i found this recipe and it came out delicious. The perfect recipe for banana bread, im not that great at baking but this is by far the best.","datePublished":"June 05, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Florecent S."}},{"@type":"Review","description":"Made this with the 4 bananas (small sized ones) and halved the sugar (1/4c brown And 1/4c white) and threw chocolate chips on top before baking it at 325 and shutting off the oven at the correct time and leaving it in there for 20 more minutes to finish baking. I don't like my banana bread too 'browbed' so that's the best way to manage that. This turned out moist and very delicious. Was a huge hit with the friends we shared it with and my mom actually asked me for the recipe after spending the afternoon telling me I should have used her fool-proof recipe. So 5 stars from me just for that!","datePublished":"April 22, 2019","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Krista Zimm"}},{"@type":"Review","description":"I've been using this recipe for 2 years and its the only one i will use now(i have tried several in the past, this one is my favorite). Today i have one in the oven and i made it chock full with nuts, cranberries, chocolate chips, coconut flakes and raisens!","datePublished":"December 18, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"margaret.litecandles"}},{"@type":"Review","description":"Love this recipe! I usually have to double the quantities as it tends to disappear quickly! This recipe is perfect (with or without walnuts or chocolate chips) but if it is at all possible to improve the melt in your mouth effect try this: wrap your loaf(s) in aluminum foil as soon as it cools down and hide it in your fridge for a couple of days before serving... You'll be surprised at the extreme melt in your mouth taste!","datePublished":"August 21, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Muriel d."}},{"@type":"Review","description":"I wanted to make something for my friends for Valentines, so I doubled the recipe, used 7 bananas and the vanilla. It made enough to fill 5 mini loaf pans! I baked it for 58 minutes. For my first try I think it came out great!","datePublished":"February 07, 2018","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Jays Bread and Jams"}},{"@type":"Review","description":"This is THE banana bread recipe! Buttery, moist and delicious.","datePublished":"November 02, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Betty Rocker"}},{"@type":"Review","description":"This is absolutely delicious. I love how simple it is too! I added 1/2 C chocolate chips and put course sugar with a sprinkle of cinnamon on the top of the bread, but honestly it would be great without it. It's an awesome recipe.","datePublished":"May 20, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Chef Acosta"}},{"@type":"Review","description":"This bread was gone before it finished cooling! Made it w It's gluten free flour and had to cook it about 10 minutes longer, but my husband couldn't even tell it was gf! He went to the store and bought a bunch of over ripe bananas! Try this!","datePublished":"April 09, 2017","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"aprille45"}},{"@type":"Review","description":"This banana bread recipe is superb!  Very moist and delicious!  I made banana bread muffins and baked them for 20 minutes and that was perfect!  I also added 1 tsp. cinnamon, 1/4 tsp. nutmeg and 1 cup walnuts.  My husband said it is the best that he's ever eaten.  I also took some to co-workers and they were amazed at how good these are.  I will definitely be making these again and again......","datePublished":"December 01, 2009","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Regina00214"}},{"@type":"Review","description":"Delicious! Made a batch with blueberries and a touch of ground ginger. Then made a batch with brown sugar, maple extract and cinnamon. Big success with my family and neighbors.","datePublished":"July 18, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"amycaster66"}},{"@type":"Review","description":"This is truly a great banana bread recipe. I added 10 mins to the cook time and the bread had a really nice caramelized crust. I will be using this as my go-to recipe from here on out.","datePublished":"February 23, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Meredith S."}},{"@type":"Review","description":"This banana bread is insanely good! Never going to use any other recipe besides this one. I like to add chocolate chips and my secret is some nutmeg as well as cinnamon. My family goes crazy for it, I highly recommend making this banana bread.","datePublished":"January 04, 2021","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"erinsmith51"}},{"@type":"Review","description":"This is a good standard Banana Bread recipe, however for this to work in a floured aluminum bread pan, extra time will be required for baking. Made this four times now and each time we had to add 20+ minutes to the baking time. Please keep this in mind.","datePublished":"November 12, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":4,"bestRating":"5"},"author":{"@type":"Person","name":"Randy J."}},{"@type":"Review","description":"This really is a super delicious recipe!!! I prefer the 4 bananas. It’s so moist! I followed the recipe precisely and won’t even look at other recipes. Why change something perfect? Thank you for sharing this great, easy, delicious recipe.","datePublished":"October 01, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"chrisgolden"}},{"@type":"Review","description":"Made this but added Reese’s pieces to it before baking! Gave it that peanut butter banana flavor my kids love!! It was soo good!","datePublished":"June 21, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Stephanie H."}},{"@type":"Review","description":"Best recipe ever! I double it and put half in mini muffin pan and left over in a loaf pan. I just finished making a double batch. 2 with walnuts and 2 without. Lol my hubby taste tested before I could take a pic. Husband approved! Lol ????","datePublished":"May 22, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"April D."}},{"@type":"Review","description":"This is the best recipe ever not only because the yummy out come of the bread, but because the very first step in the directions is to take out pots and pans from the oven. I can’t count how many times this step has been forgotten. Thank you so much, you just made me day!","datePublished":"May 22, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Jenifer D."}},{"@type":"Review","description":"I'm neglecting to eat my bananas just so I have an excuse to make this. I've made it with walnuts mixed in. I've made it with mini-chocolate chips. I've made it with the bottom of the pan lined with walnuts. I just made two more loaves. i need a support group. (even my dog likes the original recipe ...no nuts or chips for dogs though, people!) Store it in a ziploc and it retains its moisture, but not before pulling a few crispy pieces off the top. SO GOOD...","datePublished":"May 19, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"tarzana68"}},{"@type":"Review","description":"Why do people say it’s the perfect recipe and then go on to make it differently? Anyhoo, it was good...very good. I used 3 largish bananas and stuck to the recipe. The crust on the ends were nicely crispy-sweet and the inside moist. I could have baked it 5 more minutes as the very center was mooshy. I’ll make this again. P.S. I love the starting instructions.","datePublished":"May 14, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Cindy M."}},{"@type":"Review","description":"First time making this... I’m trading it in for my old recipe that we loved enough to make 5 loaves at a time. Made as is with the exception of making two small loaves: one loaf with and another loaf without pecans. This recipe is perfect down to taking the sheet pan, I had, out of the oven. I’m looking forward to playing around with this to make exciting variations. However, again, I want to stress that this recipe is perfect as is!!!!","datePublished":"May 08, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Kristy T."}},{"@type":"Review","description":"I've used tons of banana bread recipes and this is the best one I've used. Not hard to make, simple ingredients, and you can even add nuts, if you like them. But it tastes fantastic without them!!??","datePublished":"April 26, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Anonymous"}},{"@type":"Review","description":"I’ve tried many different recipes for banana bread and they’ve always been alright. But this recipe is amazing I’ve never had banana bread where I immediately wanted to make the recipe again. I went with the four bananas added a little bit of cinnamon and then sprinkled some chocolate chips on top and it was amazing and my whole family loved it too. This is definitely going to be written down as one of my favorites I highly recommend.","datePublished":"April 16, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Alexa B."}},{"@type":"Review","description":"It is simple to make, the bread is moist, and it is tasty. I used 1/4 cup sugar, 4 bananas, \u0026amp; 1/2 cup of walnuts. I look forward to baking \u0026amp; tasting with other ingredients, some bakers added chocolate chips... will likely do a walnut, chocolate chip blend","datePublished":"April 08, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"beastie1"}},{"@type":"Review","description":"In the midst of this pandemic, I found I bought too many bananas when I made my only trip out in 3 weeks. Therefore I decided to not waste them and googled a recipe as I couldn’t find my Moms recipe. I’m extremely happy I found this recipe. The only thing I did different was add some cinnamon and it was a wonderful addition. Happy baking everyone, stay positive, stay home and stay sane ??????","datePublished":"April 06, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"kathithompson0718"}},{"@type":"Review","description":"Holy moly! This is AMAZING! I only had two bananas (quarantine struggles), but they were quite large and it worked out great! Best banana bread recipe I have ever tried...hands down!","datePublished":"March 29, 2020","itemReviewed":{"@type":"Thing","name":"Best Banana Bread"},"reviewRating":{"@type":"Rating","worstRating":"1","ratingValue":5,"bestRating":"5"},"author":{"@type":"Person","name":"Anonymous"}}],"publisher":{"@type":"Organization","name":"Food.com","logo":{"@type":"ImageObject","url":"https://geniuskitchen.sndimg.com/fdc-new/img/FDC-Logo.png"},"url":"https://www.food.com"}}</script>
