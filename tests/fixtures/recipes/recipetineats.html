re.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","url":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/75eae612677fdf550ba9a478ea595902153a0a06b8b27aaf6bc3eddcf6367244?s=96&d=https%3A%2F%2Fwww.recipetineats.com%2Ftachyon%2F2024%2F06%2Favatar-guest-temp-cache-bust-duplicate.png&r=g","caption":"Nagi"},"description":"I believe you can make great food with everyday ingredients even if you’re short on time and cost conscious. You just need to cook clever and get creative!","sameAs":["http:\/\/www.recipetineats.com\/about-me\/"],"url":"https:\/\/www.recipetineats.com\/author\/nagi-maehashigmail-com\/"},{"@type":"Recipe","name":"Crispy Shredded Halloumi Salad (with kale)","author":{"@id":"https:\/\/www.recipetineats.com\/#\/schema\/person\/1684e6a75e9f91ae2e33ca2de95b47e2"},"description":"Recipe video above. This salad is all about the crispy halloumi crumble! Just shred halloumi with a box grater and pan fry until golden - it&#39;s like pangrattato, but better because it&#39;s cheese. 🙂I use it to shower a salad made with rice, finely chopped kale, pine nuts and red onion in a garlic vinaigrette for a salad designed to be eaten with a spoon, so you get a bit of everything in every mouthful.Great warm or at room temperature. Serves 4 as a light meal (top with a soft boiled egg!), or 5 to 6 as a side. Try it with Honey Garlic Chicken Breast, crispy Pan Seared Fish, or Country Pork Chops. See notes for meal prepping, the halloumi stays crispy for days!","datePublished":"2026-07-07T16:00:00+00:00","image":["https:\/\/www.recipetineats.com\/tachyon\/2026\/07\/Crispy-shredded-halloumi-salad-with-kale-7.jpg","https:\/\/www.recipetineats.com\/tachyon\/2026\/07\/Crispy-shredded-halloumi-salad-with-kale-7.jpg?resize=500%2C500","https:\/\/www.recipetineats.com\/tachyon\/2026\/07\/Crispy-shredded-halloumi-salad-with-kale-7.jpg?resize=500%2C375","https:\/\/www.recipetineats.com\/tachyon\/2026\/07\/Crispy-shredded-halloumi-salad-with-kale-7.jpg?resize=480%2C270"],"recipeYield":["4"],"recipeIngredient":["225g\/ 7.9oz   halloumi (, shredded using a box grater (Note 1))","1 1\/2 tbsp olive oil","1\/4 cup pine nuts ((or slivered almonds))","5 tightly packed cups kale leaves (, chopped into ~1 - 1.5cm\/ 0.4 - 0.6\" pieces (Note 2))","1\/4  red onion (, very finely sliced then roughly chopped (~1\/4 cup), or green onion finely sliced)","1\/4 cup roughly chopped dill ((or parsley))","3 cups cooked white rice ((1 cup uncooked rice grains), or brown rice or quinoa, warm or cooled)","3 tbsp apple cider vinegar","1\/3 cup extra virgin oil olive oil","1 tsp honey","1\/2 tsp Dijon mustard","1  garlic clove (, finely grated or crushed using garlic crusher)","1\/4 tsp heaped cooking salt \/ kosher salt ((halve for table salt, +50% for flakes))","1\/8 tsp black pepper","Soft boiled egg (, halved (Note 3))"],"recipeInstructions":[{"@type":"HowToStep","text":"Dressing - Put the ingredients in a jar and shake well until combined. Set aside to let the garlic flavour meld.","name":"Dressing - Put the ingredients in a jar and shake well until combined. Set aside to let the garlic flavour meld.","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-0-0"},{"@type":"HowToStep","text":"Toast pine nuts - Heat a large-non stick fry pan over medium heat, no oil. Add the pine nuts and stir regularly for 3 minutes or until they have light brown spots. Remove into a bowl. (Note 4 for oven method)","name":"Toast pine nuts - Heat a large-non stick fry pan over medium heat, no oil. Add the pine nuts and stir regularly for 3 minutes or until they have light brown spots. Remove into a bowl. (Note 4 for oven method)","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-0-1"},{"@type":"HowToStep","text":"Crispy shredded halloumi - Return the pan to the stove and heat the olive oil on high. Cook the shredded halloumi for 5 minutes until most of is golden or deep golden, not brown, lowering the heat to medium high if patches brown too quickly. Transfer into a bowl while you dress the kale. They will crisp up even more as they cool.","name":"Crispy shredded halloumi - Return the pan to the stove and heat the olive oil on high. Cook the shredded halloumi for 5 minutes until most of is golden or deep golden, not brown, lowering the heat to medium high if patches brown too quickly. Transfer into a bowl while you dress the kale. They will crisp up even more as they cool.","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-0-2"},{"@type":"HowToSection","name":"Assemble salad:","itemListElement":[{"@type":"HowToStep","text":"Scrunch and dress kale - Place the kale and red onion in a bowl. Pour over about 2 tablespoons of the Dressing then use your hands to massage it into the kale leaves. Scrunch boldy - kale can take it!","name":"Scrunch and dress kale - Place the kale and red onion in a bowl. Pour over about 2 tablespoons of the Dressing then use your hands to massage it into the kale leaves. Scrunch boldy - kale can take it!","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-1-0"},{"@type":"HowToStep","text":"Toss - Add the rice, dill, most of the pine nuts and remaining Dressing. Toss well.","name":"Toss - Add the rice, dill, most of the pine nuts and remaining Dressing. Toss well.","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-1-1"},{"@type":"HowToStep","text":"Plate up - Spread the salad in a wide shallow serving bowl (for maximum sprinkling surface area!). Cover the surface wtih the crispy halloumi and remaining pine nuts. You could also do this in individual bowls. Serve!","name":"Plate up - Spread the salad in a wide shallow serving bowl (for maximum sprinkling surface area!). Cover the surface wtih the crispy halloumi and remaining pine nuts. You could also do this in individual bowls. Serve!","url":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#wprm-recipe-199651-step-1-2"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"12","reviewCount":"5"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Whoops forgot to give a review!","author":{"@type":"Person","name":"MrsMac"},"datePublished":"2026-07-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I honestly wasn't expecting to love this salad as much as I did! I was especially leary of the rice, but it somehow works. The fresh dill really shines, pine nuts are a win, but the star is the haloumi! I'll be making this over and over!","author":{"@type":"Person","name":"Renate"},"datePublished":"2026-07-17"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Your crispy halloumi salad recipe has now made its way to Sweden, Nagi! I served it to my Swedish friends when visiting my home country and they loved it. I raved about your website and you have now got Swedish fans, if you didn’t already.","author":{"@type":"Person","name":"Eva"},"datePublished":"2026-07-12"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This recipe is a banger! I made it to accompany the honey garlic chicken yesterday (during the current heatwave, here in England) and it was awesome, tasty, refreshing and healthy - the perfect meal. I'm so pleased I cooked enough for 4 so we have leftovers for today..yumm.","author":{"@type":"Person","name":"JAY"},"datePublished":"2026-07-11"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Great recipe! Love it!\r\n\r\nAnd, Jaffle is so adorable!","author":{"@type":"Person","name":"Leila"},"datePublished":"2026-07-11"}],"recipeCategory":["Light mains","Side"],"recipeCuisine":["Mediterranean vibes","Western"],"keywords":"halloumi recipe, halloumi salad, kale salad","nutrition":{"@type":"NutritionInformation","calories":"606 kcal","carbohydrateContent":"38 g","proteinContent":"17 g","fatContent":"43 g","saturatedFatContent":"13 g","sodiumContent":"805 mg","fiberContent":"1 g","sugarContent":"2 g","unsaturatedFatContent":"28 g","servingSize":"1 serving"},"@id":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#recipe","isPartOf":{"@id":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/#article"},"mainEntityOfPage":"https:\/\/www.recipetineats.com\/crispy-shredded-halloumi-salad-with-kale\/"}]}</script>
